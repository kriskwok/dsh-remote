# dsh.example.com:3443 —— Mac DSH 统一入口（App 固定地址）
# 经 dsh-remote relay 自动选路：
#   同局域网 → relay 直连反代 http://192.168.1.10:3081
#   外网/公共网络 → Mac 插件主动拨入的 WSS 隧道（/relay/ws）
map $http_upgrade $dsh_mac_conn_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3443 ssl;
    listen [::]:3443 ssl;
    http2 off;

    server_name dsh.example.com;
    client_max_body_size 50m;

    ssl_certificate     /etc/ssl/dsh.example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/dsh.example.com/privkey.pem;

    access_log /var/log/nginx/dsh-mac.log;
    error_log  /var/log/nginx/dsh-mac-error.log;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $dsh_mac_conn_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;

    # Mac 插件外拨隧道端点（Bearer 鉴权在 relay 完成）
    location = /relay/ws {
        proxy_pass http://127.0.0.1:3090;
    }

    # 其余全部是 App 流量
    location / {
        proxy_pass http://127.0.0.1:3090;
    }
}

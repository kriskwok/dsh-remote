# dsh.example.com:443 —— dsh-remote 隧道兜底入口（公共 WiFi 常只放 443）
# SNI 与 443 上既有 vhost（portfolio1）共存；App 主入口仍是 3443，
# 插件隧道在 3443 连不上时自动改走这里（relay.urls 第二条）。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 off;

    server_name dsh.example.com;
    client_max_body_size 50m;

    ssl_certificate     /etc/ssl/dsh.example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/dsh.example.com/privkey.pem;

    access_log /var/log/nginx/dsh-mac443.log;
    error_log  /var/log/nginx/dsh-mac443-error.log;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $dsh_mac_conn_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;

    location = /relay/ws {
        proxy_pass http://127.0.0.1:3090;
    }
    location / {
        proxy_pass http://127.0.0.1:3090;
    }
}
